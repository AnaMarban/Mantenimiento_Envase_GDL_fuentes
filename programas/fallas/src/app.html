<title>CEMEX GDL Fallas Envase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="fe-css">
/* Layout: tablero de jefe — encabezado de marca, barra fija de periodo y filtros, luego "qué atender", indicadores con comparación, dónde × qué, tendencia. Tema claro único, fondo blanco a propósito. */
:root{
  --bg:#ffffff;--panel:#ffffff;--panel-2:#eef2f6;--line:#d8dfe7;--line-strong:#b6c2cf;
  --fg:#121c2b;--fg-2:#475769;--fg-3:#6b7a8b;
  --brand:#0a3a8c;--brand-soft:#e5ecf8;--brand-red:#d81e27;
  --accent:#0a3a8c;--accent-soft:#e5ecf8;
  --bad:#c62f2f;--bad-soft:#fbe4e2;--warn:#b86e00;--warn-soft:#fcefd6;--ok:#2f7d4f;--ok-soft:#e1f1e6;
  --a1:#0a3a8c;--a2:#c98a00;--a3:#2f7d4f;--a4:#6b4fa0;
  --g1:#c62f2f;--g2:#0a3a8c;--g3:#b86e00;--g4:#6b4fa0;--g5:#2f7d4f;--g6:#8a96a2;--g7:#3d8fb0;--g8:#9c5b3c;
  --font-d:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --font-b:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:20px}h3{font-size:16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r);padding:7px 12px;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=date],input[type=search]{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r);padding:6px 9px;min-width:0;font-size:14px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font-family:var(--font-d);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.sub{font-size:13px;color:var(--fg-2)}
.hint{font-size:13px;color:var(--fg-3)}

/* ---- encabezado ---- */
header.top{background:var(--panel);border-top:4px solid var(--brand);position:relative;z-index:20}
header.top::after{content:"";display:block;height:2px;background:linear-gradient(90deg,var(--brand-red) 0 64px,var(--line) 64px)}
.hrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{display:flex;align-items:center;height:44px;min-width:0}
.logo img{height:44px;width:auto;max-width:180px;object-fit:contain;display:block}
.logo-up{height:44px;padding:0 12px;border:1.5px dashed var(--line-strong);border-radius:var(--r);font-size:12px;color:var(--fg-3);background:var(--panel-2)}
.brand .sep{width:1px;align-self:stretch;background:var(--line)}
.brand .bt{display:grid;line-height:1.05;gap:3px}
.brand .eb{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--brand)}
.brand .eb b{color:var(--brand-red);font-weight:700}
.brand h1{font-size:28px;font-weight:700;color:var(--fg)}
.hstat{flex:1 1 260px;display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:flex-end;align-items:center;min-width:0}
.hstat .it{display:grid;line-height:1.2}
.hstat .it b{font-family:var(--font-d);font-size:17px;font-weight:600}
.hact{display:flex;gap:8px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;font-family:var(--font-d);font-size:16px;color:var(--fg-2);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
nav.tabs .cnt{font-family:var(--font-m);font-size:11px;background:var(--panel-2);border-radius:999px;padding:0 6px;color:var(--fg-2)}

/* ---- barra fija de periodo ---- */
.stick{position:relative;z-index:19;background:var(--panel-2);border-block:1px solid var(--line)}
@media (min-width:900px){.stick{position:sticky;top:env(safe-area-inset-top,0px)}}
.prow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:9px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:6px 11px;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.grp{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-2)}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border-radius:999px;padding:3px 6px 3px 11px;font-size:13px;font-weight:600;background:var(--brand);color:#fff;border-color:var(--brand)}
.fchip span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgb(255 255 255 / .22);font-size:12px}
.prange{font-size:13px;color:var(--fg-2);margin-left:auto}

main{padding-block:20px 60px;display:grid;gap:20px}
.banner{border:1px solid var(--line-strong);background:var(--panel-2);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--fg-2)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--fg)}

/* ---- qué atender ---- */
.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--g6);border-radius:0 10px 10px 0;background:var(--panel)}
.ins:hover{background:var(--accent-soft);border-color:var(--accent)}
.ins.bad{border-left-color:var(--bad)}.ins.warn{border-left-color:var(--warn)}.ins.ok{border-left-color:var(--ok)}.ins.info{border-left-color:var(--brand)}
.ins .ico{grid-row:span 3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:15px;background:var(--panel-2);color:var(--fg-2)}
.ins.bad .ico{background:var(--bad-soft);color:var(--bad)}.ins.warn .ico{background:var(--warn-soft);color:var(--warn)}.ins.ok .ico{background:var(--ok-soft);color:var(--ok)}.ins.info .ico{background:var(--brand-soft);color:var(--brand)}
.ins .t{font-weight:600;font-size:15px;line-height:1.3}
.ins .d{font-size:13px;color:var(--fg-2)}
.ins .go{font-size:13px;color:var(--accent);font-weight:600}

/* ---- indicadores ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;text-align:left;width:100%;align-content:start}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:#fff}
.kpi.hero .lbl,.kpi.hero .s{color:rgb(255 255 255 / .82)}
.kpi .v{font-family:var(--font-d);font-size:34px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:500;opacity:.8}
.kpi .s{font-size:13px;color:var(--fg-2)}
.delta{font-family:var(--font-m);font-size:12px;font-weight:500;border-radius:4px;padding:1px 6px;justify-self:start}
.delta.up{background:var(--bad-soft);color:var(--bad)}.delta.down{background:var(--ok-soft);color:var(--ok)}.delta.eq{background:var(--panel-2);color:var(--fg-2)}
.kpi.hero .delta{background:rgb(255 255 255 / .18);color:#fff}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.chartbox{position:relative;height:280px}
.chartbox.tall{height:340px}

/* carrusel */
.ringwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.ringwrap{grid-template-columns:1fr}}
.ring{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.ring .st{cursor:pointer}
.ring text{font-family:var(--font-d)}
.slist{display:grid;gap:6px}
.slist button{justify-content:space-between;width:100%;text-align:left;padding:6px 10px}
.slist .n{font-family:var(--font-d);font-size:20px;font-weight:600}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel-2);min-width:60px;flex:1}
.bar i{display:block;height:100%}

/* matriz boquilla × falla */
.mx{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px;min-width:620px}
.mx th{background:none;border:0;padding:4px 6px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--fg-2);white-space:normal;vertical-align:bottom;line-height:1.15}
.mx th.rh{text-align:left;font-family:var(--font-b);font-size:14px;font-weight:600;color:var(--fg);white-space:nowrap;cursor:pointer;vertical-align:middle}
.mx th.rh:hover{color:var(--accent);text-decoration:underline}
.mx td{border:0;padding:0;text-align:center;font-family:var(--font-m);font-size:13px;vertical-align:middle}
.mx td.c{border-radius:4px;height:30px;cursor:pointer;min-width:64px}
.mx td.c:hover{outline:2px solid var(--fg);outline-offset:-2px}
.mx td.c.sel{outline:2px solid var(--brand);outline-offset:-2px}
.mx td.tot{font-weight:600;text-align:right;padding-right:6px}
.mx tr.flag th.rh::after{content:"▲";color:var(--bad);font-size:10px;margin-left:5px;vertical-align:2px}

.areacards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.acard{display:grid;gap:4px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-top:5px solid var(--g6);border-radius:10px;background:var(--panel)}
.acard[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);border-top-width:5px}
.acard .v{font-family:var(--font-d);font-size:30px;font-weight:600;line-height:1.05}
.prio{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.prio.alta{background:var(--bad-soft);color:var(--bad)}.prio.media{background:var(--warn-soft);color:var(--warn)}.prio.baja{background:var(--panel-2);color:var(--fg-2)}
.recbox{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;display:grid;gap:4px}
.recbox ul{margin:0;padding-left:18px}
.cls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;font-size:14px}
.cls select{font-size:13px}
.lock{display:grid;gap:10px;justify-items:start}
.lock .steps3{display:flex;gap:6px}.lock .steps3 i{width:42px;height:8px;border-radius:4px;background:var(--panel-2)}.lock .steps3 i.on{background:var(--brand)}
.st-pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.st-up{background:var(--bad-soft);color:var(--bad)}.st-down{background:var(--ok-soft);color:var(--ok)}.st-eq{background:var(--panel-2);color:var(--fg-2)}.st-cr{background:var(--warn-soft);color:var(--warn)}
svg.spark{display:block}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-family:var(--font-m);font-size:12px;font-weight:500;background:var(--panel-2);color:var(--fg-2);white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-strong);background:var(--panel-2);white-space:nowrap;user-select:none}
table.t th[data-k]{cursor:pointer}
table.t th[data-k][aria-sort=ascending]::after{content:" ▲";font-size:10px}
table.t th[data-k][aria-sort=descending]::after{content:" ▼";font-size:10px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
.num{text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.alist{display:grid}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;background:none;width:100%}
.aitem:hover{background:var(--accent-soft)}
.aitem:first-child{border-top:0}
.empty{padding:22px;text-align:center;color:var(--fg-3);font-size:14px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:14px}
.rtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.hm{display:grid;gap:2px;font-size:12px;min-width:640px}
.hm div{padding:5px 2px;border-radius:3px;text-align:center;font-family:var(--font-m)}
.hm .hl{text-align:left;font-family:var(--font-b);color:var(--fg-2);white-space:nowrap}
.hm .hh{font-family:var(--font-d);color:var(--fg-2);font-size:11px;line-height:1.1;align-self:end}
.hm .cell{cursor:pointer}

.overlay{position:fixed;inset:0;z-index:40;background:rgb(10 16 22 / .45)}
.dlg{display:grid;place-items:center;padding:16px}
.mp{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:12px;border:1px solid var(--line);padding:22px;display:grid;gap:14px}
.drop{border:2px dashed var(--line-strong);border-radius:12px;padding:26px 16px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--fg-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:grid;gap:10px;counter-reset:s;margin:0;padding:0}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-weight:600}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sumgrid div{background:var(--panel-2);border-radius:var(--r);padding:8px 10px}
.sumgrid b{display:block;font-family:var(--font-d);font-size:24px}
.prog{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.meta div{background:var(--panel-2);border-radius:var(--r);padding:8px 10px}
.meta .lbl{display:block}
@media (max-width:640px){.kpi .v{font-size:28px}.brand h1{font-size:22px}.hide-sm{display:none}.hstat{justify-content:flex-start}.prange{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pwbars{display:grid;gap:4px}
.pwrow{display:grid;grid-template-columns:118px minmax(0,1fr) 86px;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px}
.pwrow:hover{background:var(--accent-soft)}
.pwrow .nm{font-weight:600;line-height:1.15}.pwrow .nm small{display:block;font-weight:400;font-size:12px;color:var(--fg-3)}
.pwrow .pc{font-family:var(--font-d);font-size:20px;font-weight:600;text-align:right}
.pwbar{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--panel-2)}
.pwbar i{display:block;height:100%}
.pwrow.off .pwbar{background:repeating-linear-gradient(45deg,var(--panel-2) 0 6px,var(--panel) 6px 12px)}
.pwrow.off .pc{font-size:14px;color:var(--fg-3);font-family:var(--font-b);font-weight:600}
.pwleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg-2)}
.pwleg span{display:inline-flex;align-items:center;gap:6px}.pwleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hm .off{background:repeating-linear-gradient(45deg,var(--panel-2) 0 4px,var(--panel) 4px 8px);color:var(--fg-3)}
.rotag{font-size:12px;color:var(--fg-3);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
</style>
<template id="fe-shell">

<header class="top">
  <div class="wrap">
    <div class="hrow">
      <div class="brand">
        <div class="logo" id="logoSlot"></div>
        <div class="sep" id="logoSep" hidden></div>
        <div class="bt"><span class="eb">CEMEX <b>GDL</b></span><h1>Reporte de Fallas Envase</h1></div>
      </div>
      <div class="hstat" id="hstat"><span class="sub">Cargando historial…</span></div>
      <div class="hact">
        <button id="btnExport" type="button" hidden>Exportar a Excel</button>
        <button class="primary" id="btnUpload" type="button"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Cargar archivos</button><span class="rotag" id="roTag" hidden>Solo lectura</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="resumen" aria-selected="true">Resumen</button>
      <button role="tab" data-t="pareto" aria-selected="false">Pareto</button>
      <button role="tab" data-t="pesos" aria-selected="false">Peso por boquilla</button>
      <button role="tab" data-t="historico" aria-selected="false">Histórico y tendencias</button>
      <button role="tab" data-t="turnos" aria-selected="false">Días y turnos</button>
      <button role="tab" data-t="registro" aria-selected="false">Registro <span class="cnt" id="regCnt"></span></button>
      <button role="tab" data-t="cargas" aria-selected="false">Actualizaciones</button>
    </nav>
  </div>
</header>

<div class="stick" id="bar">
  <div class="wrap prow">
    <div class="seg" id="per" role="group" aria-label="Periodo">
      <button type="button" data-p="dia" aria-pressed="false">Último día</button>
      <button type="button" data-p="7d" aria-pressed="true">7 días</button>
      <button type="button" data-p="mes" aria-pressed="false" id="perMes">Mes</button>
      <button type="button" data-p="todo" aria-pressed="false">Todo</button>
      <button type="button" data-p="custom" aria-pressed="false">Fechas…</button>
    </div>
    <select id="mesSel" aria-label="Mes"></select>
    <span class="grp" id="custom" hidden><input type="date" id="fD1" aria-label="Desde"> a <input type="date" id="fD2" aria-label="Hasta"></span>
    <div class="seg" id="tur" role="group" aria-label="Turno">
      <button type="button" data-tu="0" aria-pressed="true">Todos</button>
      <button type="button" data-tu="1" aria-pressed="false">T1</button>
      <button type="button" data-tu="2" aria-pressed="false">T2</button>
      <button type="button" data-tu="3" aria-pressed="false">T3</button>

function insights(F){

  if(by.length&&!S.f.eq){const [e,n]=by[0];const g=[...count(ew.filter(f=>f.eq===e),"grp")].sort((a,b)=>b[1]-a[1])[0];const x=n/avg;
    out.push({c:x>=1.5?"bad":"warn",i:"!",t:`${e} es la que más falla: ${nf(n)} fallas`,d:`${x.toFixed(1)}× el promedio de las boquillas (${nf(avg,0)}). Lo que más le pasa: ${g[0].toLowerCase()} (${g[1]}).`,go:"Filtrar esta boquilla",a:()=>setFilter({eq:e})})}

      out.push({c:"bad",i:"T"+t,t:`Turno ${t} del ${fDs(d)}: ${nf(n)} fallas`,d:`${(n/med).toFixed(0)}× un turno normal (mediana ${med}). Se concentró en ${top.map(([e,c])=>e+" ("+c+")").join(" y ")}.`,go:"Ver ese turno",a:()=>{setRangeDay(d);S.f.tu=+t;setTab("registro")}})}}

  const tg=[...count(F,"es")].sort((a,b)=>b[1]-a[1]);

    const cl=x=>x.replace(/\s*\(.*\)$/,"");out.push({c:"warn",i:"%",t:two?`${cl(n1)} e ${cl(two[0]).toLowerCase()} son el ${Math.round(sh2*100)}% de las fallas`:`${cl(n1)} es el ${Math.round(c1/F.length*100)}% de las fallas`,d:`${n1}: ${nf(c1)}${two?` · ${two[0]}: ${nf(two[1])}`:""}. Atacar estas dos causas mueve casi todo el indicador.`,go:"Ver en el registro",a:()=>{S.f.q=n1;setTab("registro")}})}
  const lg=F.filter(f=>f.min!=null&&f.min>=60).sort((a,b)=>b.min-a.min);

  return out.slice(0,6);
}

  const eRows=eqs.map(e=>trow(e,st.map(x=>val(e,x)),true)).sort((a,b)=>b.pct-a.pct);

function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("No se pudo cargar "+src));document.head.appendChild(s)})}

async function gunzipText(f){const buf=await f.arrayBuffer();const u=new Uint8Array(buf);
  if(u[0]===0x1f&&u[1]===0x8b){if(typeof DecompressionStream==="undefined")throw new Error("Este navegador no puede abrir archivos .prnx; usa Chrome o Edge actualizados.");
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
  return new TextDecoder().decode(u)}
async function handleFiles(files){
  files=files.filter(f=>/\.(pdf|prnx)$/i.test(f.name)||f.type==="application/pdf");
  const err=$("#upErr");err.textContent="";$("#upRes").innerHTML="";
  if(!files.length){err.textContent="Elige el PDF de alarmas y/o los reportes .prnx exportados de Ventolink.";return}
  $("#upProg").hidden=false;const msg=$("#upMsg"),bar=$("#upBar");
  const pdfs=files.filter(f=>!/\.prnx$/i.test(f.name));
  if(pdfs.length){try{msg.textContent="Preparando lector de PDF…";await ensurePdf()}catch(e){err.textContent="No se pudo cargar el lector de PDF. Revisa tu conexión a internet e inténtalo de nuevo.";$("#upProg").hidden=true;return}}
  const logs=[],prods=[],arch=[];let efic=null,vchk=null;
  const semana=p=>p.desde!=null&&(p.hasta==null||p.hasta-p.desde<=7*864e5+36e5);
  for(const [k,f] of files.entries()){
    try{
      msg.textContent=`Leyendo ${f.name}…`;bar.style.width=(k/files.length*100)+"%";
      if(/\.prnx$/i.test(f.name)){
        const p=pxParse(await gunzipText(f));
        if(p.kind==="prod"){const r=pxProd(p);prods.push(...r);arch.push({n:f.name,tipo:"prod",filas:r.length})}
        else if(p.kind==="efic"||p.kind==="vcheck"){
          if(!semana(p)){err.textContent+=`${f.name} cubre más de 7 días: Ventolink lo agrupa por día de la semana y no se puede saber la fecha. Expórtalo por semana. `;continue}
          if(p.kind==="efic")efic=p;else vchk=p;arch.push({n:f.name,tipo:p.kind,filas:p.rows.length})}
        else err.textContent+=`${f.name} no es un reporte de producción, eficiencia o Ventocheck de Ventolink. `;
      }else{
        const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
        const pages=await vlExtract(pdf,(n,t)=>{bar.style.width=((k+n/t)/files.length*100)+"%";msg.textContent=`Leyendo ${f.name} · página ${n} de ${t}`});
        const kind=vlKind(pages);
        if(kind==="log"){const ev=vlParseLog(pages).reverse().map((e,i)=>({ts:e.ts,d:e.d,t:evType(e.t,e.d),_i:i})).sort((a,b)=>a.ts-b.ts||a._i-b._i).map(({_i,...e})=>e);logs.push(...ev);arch.push({n:f.name,tipo:"log",filas:ev.length})}
        else if(kind==="prod"){const r=vlParseProd(pages);prods.push(...r);arch.push({n:f.name,tipo:"prod",filas:r.length})}
        else err.textContent+=`${f.name} no parece un Historical Log Report ni unas Estadísticas de producción de Ventolink. `;
      }
    }catch(e){err.textContent+=`No se pudo leer ${f.name}${e&&e.message&&/navegador/.test(e.message)?" ("+e.message+")":""}. `}
  }
  if(!arch.length){$("#upProg").hidden=true;return}
  msg.textContent="Juntando con el historial…";
  let r;
  try{r=commit(logs,prods,arch,efic||vchk?{pw:pxPesos(efic,vchk),e:!!efic,v:!!vchk}:null)}
  catch(e){err.textContent="No se pudieron juntar los datos: "+(e&&e.message||"error desconocido")+".";return}
  bar.style.width="100%";
  const resumen=`Se agregaron ${nf(r.fallas)} fallas nuevas${r.pesos?" y "+nf(r.pesos)+" registros de peso por boquilla":""}.`;
  $("#upRes").innerHTML=`<div class="sumgrid"><div><span class="lbl">Eventos nuevos</span><b>${nf(r.nuevos)}</b></div><div><span class="lbl">Fallas nuevas</span><b>${nf(r.fallas)}</b></div><div><span class="lbl">Ya estaban</span><b>${nf(r.repetidos)}</b></div><div><span class="lbl">Filas de producción</span><b>${nf(r.prod)}</b></div><div><span class="lbl">Peso por boquilla</span><b>${nf(r.pesos)}</b></div></div>
    <p class="sub" style="margin:0" id="upPub">${r.periodo?"Periodo de alarmas: "+esc(r.periodo)+". ":""}</p>`;
  msg.textContent="Publicando para todos…";
  try{const st=await persist(resumen);
    if(st==="published"){msg.textContent="Listo. Actualizando la página…";return}
    if(st==="saved"){msg.textContent="Listo.";toast(resumen);return}
    if(st==="local"){msg.textContent="Listo.";$("#upPub").insertAdjacentHTML("beforeend",`<button type="button" class="link" id="upDl">Descargar página actualizada</button>`);$("#upDl").onclick=dlPage;toast(resumen);return}
    msg.textContent="No se publicó.";
    err.textContent=st==="readonly"?"Inicia sesión para guardar los datos.":
      st==="conflict"?"Alguien actualizó el tablero al mismo tiempo. La página se va a recargar; vuelve a cargar tus archivos.":
      st==="too_large"?"El tablero ya es demasiado grande para guardarse completo. Avísale a quien lo administra.":"No se pudo publicar. Vuelve a intentarlo en un momento.";
  }catch(e){msg.textContent="No se publicó.";err.textContent="No se pudo publicar ("+(e&&e.code||e&&e.message||"error")+"). Vuelve a intentarlo en un momento."}
}
function commit(logs,prods,arch,pw){
  const fallasAntes=S.M?S.M.fallas.length:0;let nuevos=0,repetidos=0;
  const by=packMonths(logs);
  for(const mes of Object.keys(by).sort()){
    const olds=[...S.meses.values()].filter(d=>d.mes===mes);const oldE=olds.sort((a,b)=>(a.part||0)-(b.part||0)).flatMap(decodeMonth);
    const {out,added}=mergeEvents(oldE,by[mes]);nuevos+=added;repetidos+=by[mes].length-added;if(!added)continue;
    const docs=[];for(let i=0;i<out.length;i+=MAXEV){const d=encodeMonth(mes,out.slice(i,i+MAXEV));d.part=i/MAXEV;docs.push(d)}
    olds.forEach(o=>S.meses.delete(o.part?mes+"."+(o.part+1):mes));docs.forEach(d=>S.meses.set(d.part?mes+"."+(d.part+1):mes,d));
  }
  /* producción: un reporte que empieza o termina a media semana trae turnos incompletos en las orillas; se queda el valor más alto */
  const pm={};prods.forEach(r=>{const m=r.fecha.slice(0,7);(pm[m]=pm[m]||[]).push(r)});
  for(const mes of Object.keys(pm)){
    const cur=new Map(((S.prodDocs.get(mes)||{}).rows||[]).map(r=>[r[0]+"|"+r[1]+"|"+r[2]+"|"+r[6],r]));
    pm[mes].forEach(r=>{const k=r.fecha+"|"+r.turno+"|"+r.receta+"|"+r.linea,o=cur.get(k);if(o&&o[3]>=r.sacos)return;cur.set(k,[r.fecha,r.turno,r.receta,r.sacos,r.peso,r.medio,r.linea])});
    S.prodDocs.set(mes,{mes,rows:[...cur.values()].sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:a[1]-b[1])});
  }
  let pesos=0;
  if(pw){for(const [k,n] of Object.entries(pw.pw)){const c=(S.pesos[k]||[null,null,null,null,null,null,null,null,null]).slice();
      if(pw.e)for(let i=0;i<4;i++)c[i]=n[i];if(pw.v)for(let i=4;i<9;i++)c[i]=n[i];S.pesos[k]=c;pesos++}}
  rebuild();
  const fallas=S.M.fallas.length-fallasAntes;
  const periodo=logs.length?fDT(logs[0].ts).slice(0,16)+" – "+fDT(logs[logs.length-1].ts).slice(0,16):"";
  S.cargas.unshift({ts:Date.now(),archivos:arch.map(a=>({n:a.n,tipo:a.tipo})),periodo,nuevos,fallas,prod:prods.length,pesos});
  S.dirty=true;renderAll();
  return {nuevos,fallas,repetidos,prod:prods.length,periodo,pesos};
}

/* ---- guardar: la página se vuelve a publicar con los datos dentro ---- */
const RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
const HEADBITS='<title>CEMEX GDL Fallas Envase</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">\n';
const LIBS='<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n';
function snapshot(){return {v:2,meses:Object.fromEntries(S.meses),prod:Object.fromEntries(S.prodDocs),pesos:S.pesos,cargas:S.cargas.slice(0,300),areas:S.areaMap,logo:S.logo||null}}
function pageHTML(D){const g=id=>document.getElementById(id).outerHTML;
  const frag=HEADBITS+g("fe-css")+"\n"+g("fe-shell")+'\n<div id="fe-root"></div>\n'+g("fe-mount")+"\n"+LIBS+
    '<script type="application/json" id="fe-data">'+JSON.stringify(D).replace(/</g,"\\u003c")+'<\/script>\n'+g("fe-app");
  if(window.ECO&&window.ECO.wrap)return window.ECO.wrap("fallas",frag);
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+frag+'</body></html>'}
async function persist(note){
  if(S.nube){if(!S.nube.clave()){S.canEdit=false;renderAll();return "readonly"}
    try{await S.nube.guardar("fallas",snapshot());S.dirty=false;return "saved"}
    catch(e){if(e&&e.code==="clave"){S.canEdit=false;renderAll();return "readonly"}return "error"}}
  if(S.art&&S.canEdit!==false){
    try{sessionStorage.setItem("fe.note",note||"Tablero actualizado.")}catch(e){}
    try{await S.art.publish(pageHTML(snapshot()));S.dirty=false;return "published"}
    catch(e){try{sessionStorage.removeItem("fe.note")}catch(_){}
      const c=e&&e.code;
      if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].includes(c)){S.canEdit=false;renderAll();return "readonly"}
      if(c==="conflict")return "conflict";if(c==="too_large")return "too_large";throw e}}
  return "local";
}
function dlPage(){const h=pageHTML(snapshot());saveFile("Reporte_Fallas_Envase_GDL.html",new TextEncoder().encode(h)).then(()=>{S.dirty=false;renderAll()})}
$("#btnSeed").onclick=dlPage;

/* ---- Exportar ---- */
$("#btnExport").onclick=async()=>{
  if(typeof XLSX==="undefined")return toast("No se pudo cargar la librería de Excel.");
  const F=sortedF().sort((a,b)=>a.i-b.i);const {a,b}=range();
  const wb=XLSX.utils.book_new();
  const rows=F.map(f=>({"Inicio":fDT(f.i),"Fin":f.f?fDT(f.f):"","Duración (min)":f.min!=null?+f.min.toFixed(1):"","Día de producción":fD(f.dia),"Turno":f.turno,"Equipo":f.eq,"Código":f.cod,"Falla":f.es,"Tipo":f.grp,"Área":areaOf(f),"Texto original Ventolink":f.txt||"(sin texto)"}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Fallas");
  const t=[...count(F,"es")].sort((x,y)=>y[1]-x[1]).map(([k,v])=>({"Falla":k,"Veces":v}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(t),"Por tipo");
  const e=[...count(F,"eq")].sort((x,y)=>eqOrder(x[0])-eqOrder(y[0])).map(([k,v])=>({"Equipo":k,"Fallas":v}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(e),"Por equipo");
  const pw=pwBoq();if(pw.some(x=>x.n||x.evac))XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pw.map(x=>({"Boquilla":x.b,"Sacos producidos":x.evac,"Turnos trabajados":x.turnos,"Sacos pesados (Ventocheck)":x.n,"Muy ligeros (<24.5)":x.c[0],"Ligeros (24.5–24.75)":x.c[1],"En rango (24.75–25.25)":x.c[2],"Pesados (25.25–25.5)":x.c[3],"Muy pesados (>25.5)":x.c[4],"% en rango":x.ok!=null?+(x.ok*100).toFixed(1):"","Peso medio ensacadora (kg)":x.evac?+(x.kg/x.evac).toFixed(2):""}))),"Peso por boquilla");
  const P=S.M.prod.filter(p=>inR(p.fecha,p.turno)).map(p=>({"Fecha":fD(p.fecha),"Turno":p.turno,"Receta":p.receta,"Sacos":p.sacos,"Peso (kg)":p.peso,"Peso medio (kg)":p.medio}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(P),"Producción");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  await saveFile(`Fallas_envase_${a}_a_${b}.xlsx`,buf);
};
async function saveFile(name,buf){const type=/\.html$/.test(name)?"text/html":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  if(S.dl){try{const r=await S.dl.save({filename:name,data:buf});if(r&&r.status==="saved")toast("Archivo descargado.");return}catch(e){if(e&&e.code!=="unavailable"){toast("No se descargó el archivo.");return}}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(e){toast("La descarga no está disponible en esta vista.")}
}

(function(){const h=location.hash.slice(1),t=VIEWS[h]?h:(ls("fe.tab")||"resumen");S.tab=VIEWS[t]?t:"resumen";$$("#tabs [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===S.tab))})();
function loadData(remoto){let D=remoto||null;if(!D)try{D=JSON.parse(document.getElementById("fe-data").textContent)}catch(e){}
  if(!D&&window.FALLAS_SEED){const s=window.FALLAS_SEED;D={meses:{},prod:{},pesos:s.pesos||{},cargas:s.cargas||[],areas:s.areas||{},logo:null};(s.meses||[]).forEach(d=>D.meses[d.part?d.mes+"."+(d.part+1):d.mes]=d);(s.prod||[]).forEach(d=>D.prod[d.mes]=d)}
  D=D||{};S.meses=new Map(Object.entries(D.meses||{}));S.prodDocs=new Map(Object.entries(D.prod||{}));S.pesos=D.pesos||{};S.cargas=D.cargas||[];S.areaMap=D.areas||{};S.logo=D.logo||null;
  if(!S.logo&&window.FALLAS_LOGO)S.logo=window.FALLAS_LOGO}
if(window.ECO&&window.ECO.nube)S.canEdit=false;
loadData();rebuild();
try{const n=sessionStorage.getItem("fe.note");if(n){sessionStorage.removeItem("fe.note");setTimeout(()=>toast(n+" Ya lo ven todos."),400)}}catch(e){}
(async function boot(){
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const nube=window.ECO&&window.ECO.nube;
  if(nube){const d=await nube.leer("fallas");
    if(d!==undefined){S.nube=nube;if(d){loadData(d);rebuild()}S.canEdit=!!nube.clave();renderAll();return}
    S.canEdit=false;renderAll();return}
  const [art,dl,us]=await Promise.all([use("artifact"),use("downloads"),use("user")]);
  S.art=art;S.dl=dl;
  if(us&&us.canEdit){try{S.canEdit=!!(await us.canEdit())}catch(e){}}
  renderAll();
})();
