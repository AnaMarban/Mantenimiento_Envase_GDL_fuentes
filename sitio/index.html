<style id="eco-css">
/* Ecosistema: barra de marca común con menú de programas; debajo se carga un programa a la vez. */
.eco{background:#ffffff;border-top:4px solid #0a3a8c;border-bottom:1px solid #d8dfe7;font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;color:#121c2b}
.eco-in{max-width:1320px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.eco-logo{height:30px;width:auto;display:block}
.eco-site{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#475769;padding-left:16px;border-left:1px solid #d8dfe7;line-height:30px}
.eco-nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;margin-top:2px}
.eco-nav a{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-size:16px;font-weight:600;color:#475769;text-decoration:none;padding:9px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.eco-nav a:hover{color:#0a3a8c}
.eco-nav a[aria-current="page"]{color:#0a3a8c;border-bottom-color:#d81e27}
.eco-nav a:focus-visible{outline:2px solid #0a3a8c;outline-offset:-2px}
body header.top{border-top:0}
body header.top .eb{display:none}
#logoSlot,#logoSep{display:none!important}
@media (min-width:900px){.eco-nav{flex:0 1 auto;margin-top:0;margin-left:auto}.eco-in{padding-block:6px 0}}
.eco-acc{font:600 14px "Source Sans 3","Segoe UI",system-ui,sans-serif;color:#475769;background:none;border:1px solid #d8dfe7;border-radius:8px;padding:5px 12px;cursor:pointer;margin-left:auto}
.eco-acc:hover{border-color:#0a3a8c;color:#0a3a8c}
@media (min-width:900px){.eco-acc{margin-left:8px}}
.eco-dlg{position:fixed;inset:0;z-index:90;background:rgb(10 16 22 / .45);display:grid;place-items:center;padding:16px}
.eco-box{background:#fff;border-radius:12px;padding:20px;display:grid;gap:10px;width:min(340px,100%);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;color:#121c2b}
.eco-box b{font:600 20px "Barlow Semi Condensed","Arial Narrow",Arial,sans-serif}
.eco-box input{font:inherit;border:1px solid #b6c2cf;border-radius:8px;padding:8px 10px}
.eco-err{color:#c62f2f;font-size:13px;min-height:16px}
.eco-row{display:flex;gap:8px;justify-content:flex-end}
.eco-row button{font:inherit;border:1px solid #b6c2cf;background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
.eco-row .eco-ok{background:#0a3a8c;border-color:#0a3a8c;color:#fff}
</style>

 const L=[];items.filter(i=>i.s.trim()).sort((a,b)=>a.y-b.y||a.x-b.x).forEach(i=>{\n    const l=L.find(l=>Math.abs(l.y-i.y)\u003c3);if(l)l.it.push(i);else L.push({y:i.y,it:[i]})});\n  L.forEach(l=>l.it.sort((a,b)=>a.x-b.x));return L.sort((a,b)=>a.y-b.y)}\nconst VL_DT=/^(\\d{2})\\/(\\d{2})\\/(\\d{4})\\s+(\\d{2}):(\\d{2}):(\\d{2})/;\nfunction vlKind(pages){const t=pages.slice(0,1).flatMap(p=>p.items.map(i=>i.s)).join(\" \");\n  if(/Historical Log Report/i.test(t))return\"log\";if(/Estad.sticas de producci.n/i.test(t))return\"prod\";return null}\nfunction vlParseLog(pages){\n  const out=[];\n  pages.forEach((p,pi)=>{\n    const L=vlLines(p.items);\n    const hi=L.findIndex(l=>l.it.some(i=>/Date\\/Time/.test(i.s)));if(hi\u003c0)return;\n    const H=L[hi].it;\n    const xOf=re=>{const i=H.find(i=>re.test(i.s));return i?i.x:null};\n    const xDesc=xOf(/^Event Description/)??xOf(/^Event$/), xType=H.filter(i=>/^Event( Type)?$/.test(i.s.trim())||/^Event Type/.test(i.s)).map(i=>i.x).filter(x=>x>(xDesc??0)+50)[0], xUser=xOf(/^User/);\n    const body=L.slice(hi+1).filter(l=>!l.it.some(i=>/^Pag\\.?/.test(i.s.trim())));\n    const anchors=[];\n    body.forEach(l=>{\n      const txt=l.it.map(i=>i.s).join(\" \").trim();const m=txt.match(VL_DT);\n      const seg=(a,b)=>l.it.filter(i=>i.x>=a-2&&i.x\u003cb-2).map(i=>i.s).join(\" \").replace(/\\s+/g,\" \").trim();\n      if(m){\n        let d=seg(xDesc,xType);\n        anchors.push({y:l.y,ts:Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]),parts:[[l.y,d]],t:seg(xType,xUser??1e9),pg:pi+1});\n      }else l._c=true;\n    });\n    body.filter(l=>l._c).forEach(l=>{if(!anchors.length)return;\n      let a=anchors[0],best=1e9;anchors.forEach(x=>{const d=Math.abs(x.y-l.y);if(d\u003cbest){best=d;a=x}});\n      a.parts.push([l.y,l.it.filter(i=>i.x\u003cxType-2).map(i=>i.s).join(\" \").replace(/\\s+/g,\" \").trim()])});\n    anchors.forEach(a=>out.push({ts:a.ts,d:a.parts.sort((x,y)=>x[0]-y[0]).map(x=>x[1]).filter(Boolean).join(\" \").replace(/\\s+/ O. IMPOSSIBILE RIPRISTINARE RISOLUZIONE DISPLAY\":\"Indicador sellado: no se puede restablecer la resoluci\u00f3n del display\",\"PESO MEDIO PRE-IMBALLAGGI TROPPO BASSO\":\"Peso medio de preempaque demasiado bajo\",\"PRE-RISCALDAMENTO\":\"Precalentamiento\",\"RICETTA NON VALIDA\":\"Receta no v\u00e1lida\",\"OFFSET TRACKING FUORI LIMITE\":\"Offset tracking fuera de l\u00edmite\",\"VALORE RISOLUZIONE PESO VISUALIZZATO NON VALIDO\":\"Valor de resoluci\u00f3n de peso mostrado no v\u00e1lido\",\"OSTRUZIONE FOTOCELLULA USCITA SACCO\":\"Obstrucci\u00f3n fotocelda de salida de saco\",\"DIFETTO FOTOCELLULA USCITA SACCO\":\"Falla fotocelda de salida de saco\",\"DIFETTO FOTOCELLULA INGRESSO SACCO\":\"Falla fotocelda de entrada de saco\",\"VELOCIT\u0391' NASTRO TRASPORTATORE NON CORRETTA\":\"Velocidad de banda transportadora incorrecta\",\"VELOCITA' NASTRO TRASPORTATORE NON CORRETTA\":\"Velocidad de banda transportadora incorrecta\",\"OSTRUZIONE FOTOCELLULA INGRESSO SACCO\":\"Obstrucci\u00f3n fotocelda de entrada de saco\",\"DIFETTO CAMPIONAMENTO PESO\":\"Falla de muestreo de peso\",\"ALLARME DICO EWU040\":\"Alarma DICO EWU040\",\"BILANCIA NON CALIBRATA\":\"B\u00e1scula no calibrada\",\"INTENTO DE CARGA FALLITO\":\"Intento de carga fallido\",\"SACO ROTO POR FAVOR QUITARLO\":\"Saco roto (retirarlo)\",\"FALTA DE AIRE. POR FAVOR CONTROLAR\":\"Falta de aire (revisar)\",\"M\u00d3DULO SLOT1 NO CORRECTO\":\"M\u00f3dulo SLOT1 no correcto\",\"VENTODIGIT NO PRESENTE\":\"Ventodigit no presente\",\"VENTOCHECK NO PRESENTE\":\"Ventocheck no presente\",\"M\u00d3DULO DE PESAJE NO RESPONDE\":\"M\u00f3dulo de pesaje no responde\",\"FUERA DEL L\u00cdMITE INFERIOR\":\"Fuera del l\u00edmite inferior\",\"DEFECTO DISPOSITIVO DE DETECCI\u00d3N SACO\":\"Falla en dispositivo de detecci\u00f3n de saco\",\"T\u00c9RMICO ACTIVADO\":\"T\u00e9rmico activado\",\"BALANZA EN SOBRECARGA\":\"Balanza en sobrecarga\",\"OBSTRUCCI\u00d3N CINTAS ENTRADA BALANZA\":\"Obstrucci\u00f3n en bandas de entrada a la b\u00e1scula\",\"EXCESIVO DESCARTE SACOS\":\"Excesivo descarte de sacos\",\"DICO 908A NO PRESENTE\":\"DICO 908A no presente\",\"DICO 908D NO PRESENTE\":\"DICO 908D no presente\",\"DICO EWU040 NO PRESENTE\":\"DICO EWU040 no presente\"};\nconst GRUPOS=[\"Saco roto\",\"Carga fallida\",\"Pesaje fuera de rango\",\"Detecci\u00f3n de saco\",\"Aire / t\u00e9rmico\",\"Electr\u00f3nica / m\u00f3dulos\",\"Fotoceldas / obstrucci\u00f3n\",\"B\u00e1scula de control\"];\nconst ALRE=/^L1(?: ((?:EWU|VCK) \\d+))? - (\\d+)\\)? ?(.*)$/;\nconst TCODE={\"ALARM ON\":0,\"ALARM OFF\":1,\"ALARM ACK\":2};\nfunction evType(t,d){if(t in TCODE)return TCODE[t];if(/^Communication error/i.test(d))return 3;if(/^Communication established/i.test(d))return 4;return 5}\nfunction capit(s){s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)}\nfunction normAlarm(d){const m=d.match(ALRE);if(!m)return null;const ewu=m[1]||\"\",eq=ewu?ewu.replace(/^EWU/,\"Boquilla\"):\"L\u00ednea\",cod=+m[2],txt=(m[3]||\"\").trim();\n  const es=ES[txt]||(txt?capit(txt):`Alarma ${cod} (sin texto)`);return {eq,ewu,cod,txt,es,grp:grupo(ewu||eq,cod,txt)}}\nfunction grupo(eq,cod,txt){if(eq.startsWith(\"EWU\")){if(cod===43)return\"Saco roto\";if(cod===44)return\"Carga fallida\";if(cod===59||cod===47)return\"Pesaje fuera de rango\";if(cod===51)return\"Detecci\u00f3n de saco\";if(cod===14||cod===52)return\"Aire / t\u00e9rmico\";return\"Electr\u00f3nica / m\u00f3dulos\"}\n  if(eq.startsWith(\"VCK\"))return\"Electr\u00f3nica / m\u00f3dulos\";const u=txt.toUpperCase();if(u.includes(\"FOTOCEL\")||u.includes(\"OBSTRUC\")||u.includes(\"OSTRUZ\"))return\"Fotoceldas / obstrucci\u00f3n\";return\"B\u00e1scula de control\"}\nfunction turnoDe(ts){const d=new Date(ts),h=d.getUTCHours();const day=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());\n  if(h>=7&&h\u003c15)return{t:1,dia:day};if(h>=15&&h\u003c23)return{t:2,dia:day};return{t:3,dia:h>=23?day+864e5:day}}\nconst isoD=ms=>new Date(ms).toISOString().slice(0,10);\n/* eventos: [{ts,d,t(code)}] en orden cronol\u00f3gico */\nfunction buildModel(events,prodRows){\n  const fallas=[],com=[],sys=[],open=new Map();let cur=null;\n  events.forEach(e=>{\n    if(e.t===0||e.t===1){const n=normAlarm(e.d);if(!n){sys.push(e);return}\n      if(e.t===0){const f=Object.assign({i:e.ts,f:null},n);const tt=turnoDe(e.ts);f.turno=tt.t;f.dia=isoD(tt.dia);open.set(e.d,f);fallas.push(f)}\n      else{const f=open.get(e.d);if(f){f.f=e.ts;open.delete(e.d)}}}\n    else if(e.t===3){cur={i:e.ts,f:null};const tt=turnoDe(e.ts);cur.turno=tt.t;cur.dia=isoD(tt.dia);com.push(cur)}\n    else if(e.t===4){if(cur&&cur.f===null)cur.f=e.ts}\n    else if(e.t===5)sys.push(e);\n  });\n  fallas.forEach(f=>f.min=f.f!=null?(f.f-f.i)/6e4:null);com.forEach(c=>c.s=c.f!=null?(c.f-c.i)/1e3:null);\n  const prod=(prodRows||[]).slice().sort((a,b)=>a.fecha\u003cb.fecha?-1:a.fecha>b.fecha?1:a.turno-b.turno);\n  return {fallas,com,sys,prod,n:events.length,desde:events.length?events[0].ts:null,hasta:events.length?events[events.length-1].ts:null}}\n/* empaquetado por mes para guardar */\nconst MAXEV=9000;\nfunction packMonths(events){ // events with ts,d,t -> {\"YYYY-MM\":[{...}]}\n  const by={};events.forEach(e=>{const m=isoD(e.ts).slice(0,7);(by[m]=by[m]||[]).push(e)});return by}\nfunction encodeMonth(mes,evs){const base=Date.UTC(+mes.slice(0,4),+mes.slice(5,7)-1,1);const dict=[],di=new Map();\n  const ev=evs.map(e=>{let k=di.get(e.d);if(k===undefined){k=dict.length;dict.push(e.d);di.set(e.d,k)}return [Math.round((e.ts-base)/1e3),k,e.t]});\n  return {mes,base,dict,ev}}\nfunction decodeMonth(doc){return doc.ev.map(x=>({ts:doc.base+x[0]*1e3,d:doc.dict[x[1]],t:x[2]}))}\nfunction mergeEvents(oldE,newE){ // multiconjunto: conserva el mayor conteo por clave\n  const key=e=>e.ts+\"|\"+e.t+\"|\"+e.d;const cnt=new Map();oldE.forEach(e=>cnt.set(key(e),(cnt.get(key(e))||0)+1));\n  const seen=new Map();let added=0;const out=oldE.slice();\n  newE.forEach(e=>{const k=key(e);const s=(seen.get(k)||0)+1;seen.set(k,s);if(s>(cnt.get(k)||0)){out.push(e);added++}});\n  out.forEach((e,i)=>e._o=e._o??i);out.sort((a,b)=>a.ts-b.ts||(a._o-b._o));out.forEach(e=>delete e._o);return {out,added}}\n\n/* ==== Lector de reportes .prnx de Ventolink (DevExpress XtraReports: XML comprimido con gzip) ==== */\nfunction pxDec(s){return s==null?s:s.replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/&#(\\d+);/g,(_,d)=>String.fromCharCode(+d))\n  .replace(/&quot;/g,'\"').replace(/&apos;/g,\"'\").replace(/&lt;/g,\"\u003c\").replace(/&gt;/g,\">\").replace(/&amp;/g,\"&\")}\n/* Recorre las etiquetas de texto del reporte: {x,y,t(texto),v(valor),ty(tipo .NET)} en el orden del archivo */\nfunction pxBricks(xml){\n  const out=[],re=/\u003cItem\\d+\\s([^>]*?)\\/?>/g;let m;\n  while((m=re.exec(xml))){const a=m[1];if(a.indexOf('BrickType=\"Label\"')\u003c0)continue;\n    const at={};a.replace(/([\\w:]+)=\"([^\"]*)\"/g,(_,k,v)=>{at[k]=v;return\"\"});if(!at.Rect)continue;\n    const r=at.Rect.split(\",\").map(Number);out.push({x:r[0],y:r[1],t:pxDec(at.Text),v:at.TextValue!==undefined?pxDec(at.TextValue):undefined,ty:at.TextValue_type})}\n  return out}\nconst PX_NORM=s=>String(s||\"\").replace(/\\s+/g,\" \").trim();\n/* Convierte un reporte en filas usando los encabezados de columna (misma x) */\nfunction pxParse(xml){\n  const B=pxBricks(xml),hdr=new Map(),fechas=[];let titulo=\"\";\n  B.forEach(b=>{if(!b.t)return;const t=PX_NORM(b.t);\n    if(/^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}/.test(t)){if(!fechas.includes(t))fechas.push(t);return}\n    if(b.ty!==undefined)return;\n    if(/VENTOLINK/i.test(t)){titulo=titulo||t;return}\n    if(b.y===0&&t!==\"xtraReport1\"&&!/^[\\d.\\- :]+$/.test(t)&&t!==\"All\")hdr.set(Math.round(b.x),t)});\n  const cols=new Set(hdr.values());\n  const kind=cols.has(\"Clase Peso\")?\"vcheck\":cols.has(\"Tot Evacuados\")?\"efic\":(cols.has(\"Tot Sacos\")&&cols.has(\"Fecha\"))?\"prod\":null;\n  const rows=[];let g=[],gy=null;\n  const flush=()=>{if(!g.length)return;const r= cdiv class=\"err\" id=\"upErr\">\u003c/div>\u003cdiv id=\"upRes\">\u003c/div>`;\n  $(\"#modal\").hidden=false;\n  const drop=$(\"#drop\"),inp=$(\"#fileIn\");\n  inp.onchange=()=>handleFiles([...inp.files]);\n  drop.ondragover=e=>{e.preventDefault();drop.classList.add(\"over\")};drop.ondragleave=()=>drop.classList.remove(\"over\");\n  drop.ondrop=e=>{e.preventDefault();drop.classList.remove(\"over\");handleFiles([...e.dataTransfer.files])};\n}\nfunction closeModal(){$(\"#modal\").hidden=true}\n$(\"#mClose\").onclick=closeModal;$(\"#modal\").onclick=e=>{if(e.target.id===\"modal\")closeModal()};\ndocument.addEventListener(\"keydown\",e=>{if(e.key===\"Escape\"&&!$(\"#modal\").hidden)closeModal()});\n$(\"#btnUpload\").onclick=openModal;$(\"#btnUpload2\").onclick=openModal;\n\nasync function gunzipText(f){const buf=await f.arrayBuffer();const u=new Uint8Array(buf);\n  if(u[0]===0x1f&&u[1]===0x8b){if(typeof DecompressionStream===\"undefined\")throw new Error(\"Este navegador no puede abrir archivos .prnx; usa Chrome o Edge actualizados.\");\n    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream(\"gzip\"))).text()}\n  return new TextDecoder().decode(u)}\nasync function handleFiles(files){\n  files=files.filter(f=>/\\.(pdf|prnx)$/i.test(f.name)||f.type===\"application/pdf\");\n  const err=$(\"#upErr\");err.textContent=\"\";$(\"#upRes\").innerHTML=\"\";\n  if(!files.length){err.textContent=\"Elige el PDF de alarmas y/o los reportes .prnx exportados de Ventolink.\";return}\n  $(\"#upProg\").hidden=false;const msg=$(\"#upMsg\"),bar=$(\"#upBar\");\n  const pdfs=files.filter(f=>!/\\.prnx$/i.test(f.name));\n  if(pdfs.length){try{msg.textContent=\"Preparando lector de PDF\u2026\";await ensurePdf()}catch(e){err.textContent=\"No se pudo cargar el lector de PDF. Revisa tu conexi\u00f3n a internet e int\u00e9ntalo de nuevo.\";$(\"#upProg\").hidden=true;return}}\n  const logs=[],prods=[],arch=[];let efic=null,vchk=null;\n  const semana=p=>p.desde!=nu inistra.\":\"No se pudo publicar. Vuelve a intentarlo en un momento.\";\n  }catch(e){msg.textContent=\"No se public\u00f3.\";err.textContent=\"No se pudo publicar (\"+(e&&e.code||e&&e.message||\"error\")+\"). Vuelve a intentarlo en un momento.\"}\n}\nfunction commit(logs,prods,arch,pw){\n  const fallasAntes=S.M?S.M.fallas.length:0;let nuevos=0,repetidos=0;\n  const by=packMonths(logs);\n  for(const mes of Object.keys(by).sort()){\n    const olds=[...S.meses.values()].filter(d=>d.mes===mes);const oldE=olds.sort((a,b)=>(a.part||0)-(b.part||0)).flatMap(decodeMonth);\n    const {out,added}=mergeEvents(oldE,by[mes]);nuevos+=added;repetidos+=by[mes].length-added;if(!added)continue;\n    const docs=[];for(let i=0;i\u003cout.length;i+=MAXEV){const d=encodeMonth(mes,out.slice(i,i+MAXEV));d.part=i/MAXEV;docs.push(d)}\n    olds.forEach(o=>S.meses.delete(o.part?mes+\".\"+(o.part+1):mes));docs.forEach(d=>S.meses.set(d.part?mes+\".\"+(d.part+1):mes,d));\n  }\n  /* producci\u00f3n: un reporte que empieza o termina a media semana trae turnos incompletos en las orillas; se queda el valor m\u00e1s alto */\n  const pm={};prods.forEach(r=>{const m=r.fecha.slice(0,7);(pm[m]=pm[m]||[]).push(r)});\n  for(const mes of Object.keys(pm)){\n    const cur=new Map(((S.prodDocs.get(mes)||{}).rows||[]).map(r=>[r[0]+\"|\"+r[1]+\"|\"+r[2]+\"|\"+r[6],r]));\n    pm[mes].forEach(r=>{const k=r.fecha+\"|\"+r.turno+\"|\"+r.receta+\"|\"+r.linea,o=cur.get(k);if(o&&o[3]>=r.sacos)return;cur.set(k,[r.fecha,r.turno,r.receta,r.sacos,r.peso,r.medio,r.linea])});\n    S.prodDocs.set(mes,{mes,rows:[...cur.values()].sort((a,b)=>a[0]\u003cb[0]?-1:a[0]>b[0]?1:a[1]-b[1])});\n  }\n  let pesos=0;\n  if(pw){for(const [k,n] of Object.entries(pw.pw)){const c=(S.pesos[k]||[null,null,null,null,null,null,null,null,null]).slice();\n      if(pw.e)for(let i=0;i\u003c4;i++)c[i]=n[i];if(pw.v)for(let i=4;i\u003c9;i++)c[i]=n[i];S.pesos[k]=c;pesos++}}\n  rebuild();\n  const fallas=S.M.fallas.length-fallasAntes;\n  const periodo=logs.le \"false\">Actualizaciones\u003c/button>\n    \u003c/nav>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"stick\" id=\"bar\">\n  \u003cdiv class=\"wrap prow\">\n    \u003clabel class=\"sub\" style=\"display:flex;gap:8px;align-items:center\">Semana \u003cselect id=\"fSem\">\u003c/select>\u003c/label>\n    \u003clabel class=\"sub\" style=\"display:flex;gap:8px;align-items:center\">Categor\u00eda \u003cselect id=\"fCat\">\u003c/select>\u003c/label>\n    \u003clabel class=\"sub\" style=\"display:flex;gap:8px;align-items:center\">Tipo de trabajo \u003cselect id=\"fTipo\">\u003c/select>\u003c/label>\n    \u003cinput type=\"search\" id=\"fQ\" placeholder=\"Buscar equipo o hallazgo\u2026\" style=\"flex:1 1 200px\">\n  \u003c/div>\n\u003c/div>\n\n\u003cmain class=\"wrap\">\n  \u003csection id=\"v-resumen\" data-view>\n    \u003cdiv style=\"display:grid;gap:20px\">\n      \u003cdiv class=\"kpis\" id=\"kpis\">\u003c/div>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"ch\">\u003ch2>Hallazgos por categor\u00eda\u003c/h2>\u003cspan class=\"hint\">Respuestas en \"No\" de las rutinas\u003c/span>\u003c/div>\u003cdiv class=\"chartbox\">\u003ccanvas id=\"cCat\">\u003c/canvas>\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"ch\">\u003ch2>Tipo de trabajo\u003c/h2>\u003cspan class=\"hint\">Clasificado seg\u00fan el comentario del t\u00e9cnico\u003c/span>\u003c/div>\u003cdiv class=\"chartbox\">\u003ccanvas id=\"cTipo\">\u003c/canvas>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"ch\">\u003ch2>Equipos con m\u00e1s hallazgos\u003c/h2>\u003cspan class=\"hint\">Clic para verlos en la lista\u003c/span>\u003c/div>\u003cdiv class=\"alist\" id=\"topEq\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"ch\">\u003ch2>Rutinas por categor\u00eda\u003c/h2>\u003cspan class=\"hint\">Cu\u00e1ntas se hicieron y cu\u00e1ntas encontrar ]))-Math.max(...a.map(h=>PR[h.prio]))||b.length-a.length);\n  $(\"#hTitle\").textContent=`Hallazgos para el programa del lunes \u00b7 ${H.length} en ${grp.length} equipos`;\n  $(\"#hList\").innerHTML=grp.length?grp.map(g=>{const r=g[0].r;const top=g.reduce((m,h)=>PR[h.prio]>PR[m]?h.prio:m,\"baja\");\n    return `\u003carticle class=\"eqcard\">\u003cdiv class=\"h\">\u003cspan>\u003cspan class=\"prio ${top}\">${top[0].toUpperCase()+top.slice(1)}\u003c/span> \u003cb>${esc(r.eq)}\u003c/b> \u003cspan class=\"pill\">${esc(r.cat)}\u003c/span>\u003c/span>\u003cspan class=\"sub\">${esc(r.f)} \u00b7 ${esc(r.reg||\"\")}\u003c/span>\u003c/div>\n      ${g.sort((a,b)=>PR[b.prio]-PR[a.prio]).map(h=>`\u003cdiv class=\"find\">\u003cspan class=\"tipo\">\u003ci style=\"background:${tcol(h.tipo)}\">\u003c/i>${esc(h.tipo)}\u003c/span>\u003cdiv>\u003cdiv>${esc(h.com||\"(sin comentario)\")}\u003c/div>\u003cdiv class=\"q\">${esc(h.preg)}\u003c/div>\u003c/div>\u003cspan class=\"prio ${h.prio}\">${h.prio}\u003c/span>\u003c/div>`).join(\"\")}\u003c/article>`}).join(\"\"):`\u003cdiv class=\"empty\">Sin hallazgos con estos filtros.\u003c/div>`;\n}\nfunction rHist(){\n  const W=weeks();\n  $(\"#semTbl\").innerHTML=W.map(w=>{const H=hallazgos(w);return `\u003ctr>\u003ctd>\u003cbutton class=\"link\" type=\"button\" data-w=\"${w.desde}\">${esc(semLbl(w))}\u003c/button>\u003c/td>\u003ctd class=\"num\">${w.regs.length}\u003c/td>\u003ctd class=\"num\">${new Set(w.regs.map(r=>r.eq)).size}\u003c/td>\u003ctd class=\"num\">\u003cb>${H.length}\u003c/b>\u003c/td>\u003ctd class=\"num\">${new Set(H.map(h=>h.r.eq)).size}\u003c/td>\u003c/tr>`}).join(\"\");\n  $$(\"#semTbl [data-w]\").forEach(b=>b.onclick=()=>{S.cur=b.dataset.w;S.tab=\"resumen\";renderAll()});\n  const m=new Map();W.forEach(w=>new Set(hallazgos(w).map(h=>h.r.cat+\"|\"+h.r.eq)).forEach(k=>{(m.get(k)||m.set(k,[]).get(k)).push(w)}));\n  const rep=[...m].filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length);\n  $(\"#rep\").innerHTML=W.len \"#fileIn\").onchange=e=>handle([...e.target.files]);\ndrop.ondragover=e=>{e.preventDefault();drop.classList.add(\"over\")};drop.ondragleave=()=>drop.classList.remove(\"over\");\ndrop.ondrop=e=>{e.preventDefault();drop.classList.remove(\"over\");handle([...e.dataTransfer.files])};\nasync function handle(files){\n  const err=$(\"#upErr\");err.textContent=\"\";let n=0,last=\"\";\n  for(const f of files){try{const w=normFile(JSON.parse(await f.text()));const old=S.sem.get(w.desde);\n      if(old&&old.hasta===w.hasta){const m=new Map(old.regs.map(r=>[r.c,r]));w.regs.forEach(r=>m.set(r.c,r));w.regs=[...m.values()]}\n      if(S.db)await S.db.collection(\"semanas\").doc(w.desde).set(w);S.sem.set(w.desde,w);n+=w.regs.length;last=w.desde}\n    catch(e){err.textContent+=`${f.name}: ${e.message||\"no se pudo leer\"}. `}}\n  if(last&&S.nube){try{await S.nube.guardar(\"dynamix\",{semanas:[...S.sem.values()]})}catch(e){err.textContent=\"No se pudo guardar. Inicia sesi\u00f3n e intenta de nuevo.\";return}}\n  if(last){S.cur=last;S.mode=\"ok\";$(\"#upRes\").innerHTML=`\u003cdiv class=\"banner\">${n} rutinas cargadas.\u003c/div>`;toast(\"Reporte cargado.\");renderAll()}\n}\n$(\"#btnExport\").onclick=async()=>{\n  const w=curW(),H=filtH(hallazgos(w));const wb=XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(H.map(h=>({\"Prioridad sugerida\":h.prio,\"Categor\u00eda\":h.r.cat,\"Equipo\":h.r.eq,\"Hallazgo\":h.com,\"Revisi\u00f3n\":h.preg,\"Tipo de trabajo\":h.tipo,\"Fecha\":h.r.f,\"Registr\u00f3\":h.r.reg,\"C\u00f3digo Dynamix\":h.r.c}))),\"Hallazgos\");\n  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(filtR(w).map(r=>({\"Fecha\":r.f,\"Categor\u00eda\":r.cat,\"Equipo\":r.eq,\"Preguntas\":r.ans.length,\"Respuestas No\":r.ans.filter(a=>a[1]===\"No\").length,\"Registr\u00f3\":r.reg,\"Estatus\":r.est,\"Alerta\":r.al,\"C\u00f3digo\":r.c}))),\"Rutinas\");\n  const buf=XLSX.write(wb,{bookType:\"xlsx\",type:\"array\"}),name=`Dynamix_hallazgos_${w.desde}_a_${w.hasta}.xlsx`;\n  if(S.dl){try{const r=await S.dl.save({filename:name,data:buf});if(r.status===\"saved\")toast(\"Archivo descargado.\");return}catch(e){if(e&&e.code!==\"unavailable\"){toast(\"No se descarg\u00f3 el archivo.\");return}}}\n  try{const a=document.createElement(\"a\");a.href=URL.createObjectURL(new Blob([buf]));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),2000)}catch(e){toast(\"La descarga no est\u00e1 disponible en esta vista.\")}\n};\n\n/* ---- arranque ---- */\nrenderAll();\n(async function boot(){\n  let seed=window.DYNAMIX_SEED;\n  const nube=window.ECO&&window.ECO.nube,ro=v=>{[\"#btnUpload\",\"#btnUpload2\"].forEach(x=>{const b=$(x);if(b)b.hidden=v})};\n  if(!seed){try{seed=JSON.parse($(\"#dx-data\").textContent)}catch(e){}}\n  if(nube){ro(true);const d=await nube.leer(\"dynamix\");if(d!==undefined){S.nube=nube;if(d)seed=d;ro(!nube.clave())}}\n  else if(!(window.claude&&window.claude.use)&&location.protocol!==\"file:\")ro(true);\n  if(seed&&(!(window.claude&&window.claude.use)||S.nube)){(seed.semanas||[]).forEach(w=>S.sem.set(w.desde,w));S.cur=weeks()[0]?.desde||\"\";S.mode=S.sem.size?\"ok\":\"empty\";renderAll();return}\n  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);\n  const [db,dl]=await Promise.all([use(\"db\"),use(\"downloads\")]);S.dl=dl;\n  if(!db){S.noDb=true;S.mode=\"empty\";renderAll();return}\n  S.db=db;\n  db.collection(\"semanas\").onSnapshot(s=>{S.sem=new Map(s.docs.map(d=>[d.id,d.data()]));if(!S.sem.has(S.cur))S.cur=weeks()[0]?.desde||\"\";S.mode=S.sem.size?\"ok\":\"empty\";renderAll()},e=>{S.mode=\"empty\";renderAll()});\n})();\n\u003c/script>\n\n"}</script>

(function(){

  var LIBS='<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n';
  function pick(){

  try{localStorage.setItem("eco.mod",cur)}catch(e){}
  var links=document.querySelectorAll("#eco-bar [data-m]");
  for(var i=0;i<links.length;i++){
    (function(a){
      if(a.getAttribute("data-m")===cur)a.setAttribute("aria-current","page");
      a.addEventListener("click",function(ev){
        ev.preventDefault();var k=a.getAttribute("data-m");if(k===cur)return;

      });

    guardar:function(k,obj){return fetch(API+"?k="+k,{method:"PUT",headers:{"content-type":"application/json","x-clave":clave()},body:JSON.stringify(obj)}).then(function(r){if(r.status===401||r.status===403){var e=new Error("clave");e.code="clave";throw e}if(!r.ok){var e2=new Error("error");e2.code="error";throw e2}return true})}
  };
